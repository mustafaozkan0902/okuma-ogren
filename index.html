<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>1. Sınıf İlk 4 Hafta: Hece Birleştir & Sesle Teyit Et</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: #f8fafc;
      --foreground: #0f172a;
      --card: #ffffff;
      --border: #e2e8f0;
      --muted-foreground: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0f172a;
        --foreground: #f8fafc;
        --card: #1e293b;
        --border: #334155;
        --muted-foreground: #94a3b8;
      }
    }
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .syl-red { color: #e11d48; }
    .syl-blue { color: #2563eb; }

    @keyframes popIn {
      0% { transform: scale(0.88); opacity: 0.5; }
      60% { transform: scale(1.06); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }

    @keyframes slideLeft {
      0% { transform: translateX(-30px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideRight {
      0% { transform: translateX(30px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    .slide-l { animation: slideLeft 0.35s ease-out; }
    .slide-r { animation: slideRight 0.35s ease-out; }

    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }
    .pulse-btn { animation: pulseRing 2s infinite; }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased min-h-screen">

  <!-- Mobil Uygulama Konteyneri -->
  <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between pb-6">

    <!-- ÜST BAŞLIK & YILDIZ SAYACI -->
    <header class="sticky top-0 z-30 bg-[var(--card)]/95 backdrop-blur border-b border-[var(--border)] px-4 py-3 flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-black text-lg shadow-sm">
          1.S
        </div>
        <div>
          <h1 class="font-extrabold text-sm leading-tight">Hece Birleştir & Oku</h1>
          <p class="text-[11px] font-semibold text-blue-600 dark:text-blue-400">MEB İlk 4 Hafta Planı (A-N-E-T-İ)</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 bg-amber-500/15 border border-amber-500/30 px-3 py-1.5 rounded-2xl">
        <span class="text-base">⭐</span>
        <span id="star-score" class="font-black text-amber-600 dark:text-amber-400 text-sm">0</span>
      </div>
    </header>

    <div class="px-4 pt-3">
      <div class="grid grid-cols-4 gap-1.5">
        <button onclick="selectWeek(0)" id="week-btn-0" class="week-btn py-2 px-1 rounded-2xl border-2 text-center transition-all bg-blue-600 text-white border-blue-600 shadow-sm">

          <div class="text-sm font-black">A - N</div>
        </button>
        <button onclick="selectWeek(1)" id="week-btn-1" class="week-btn py-2 px-1 rounded-2xl border-2 text-center transition-all bg-[var(--card)] border-[var(--border)]">
          <div class="text-[10px] font-bold text-[var(--muted-foreground)]">2. HAFTA</div>
          <div class="text-sm font-black">E</div>
        </button>
        <button onclick="selectWeek(2)" id="week-btn-2" class="week-btn py-2 px-1 rounded-2xl border-2 text-center transition-all bg-[var(--card)] border-[var(--border)]">
          <div class="text-[10px] font-bold text-[var(--muted-foreground)]">3. HAFTA</div>
          <div class="text-sm font-black">T</div>
        </button>
        <button onclick="selectWeek(3)" id="week-btn-3" class="week-btn py-2 px-1 rounded-2xl border-2 text-center transition-all bg-[var(--card)] border-[var(--border)]">
          <div class="text-[10px] font-bold text-[var(--muted-foreground)]">4. HAFTA</div>
          <div class="text-sm font-black">İ</div>
        </button>
      </div>

      <!-- Hafta Kazanım Özeti -->

        <span id="week-desc" class="font-bold text-blue-700 dark:text-blue-300">Hedef Sesler: A, a, N, n → an, na, ana</span>
        <span id="card-progress" class="font-extrabold px-2 py-0.5 rounded-full bg-blue-600 text-white text-[11px]">1 / 5</span>
      </div>
    </div>

    <!-- ANA ÇALIŞMA SAHNESİ (HECE BİRLEŞTİRME & TEYİT) -->

      <div class="bg-[var(--card)] border-2 border-[var(--border)] rounded-3xl p-5 shadow-sm flex flex-col items-center justify-between space-y-4">
        
        <!-- Adım Yönergesi -->
        <div id="step-instruction" class="w-full py-1.5 px-3 rounded-xl bg-amber-500/10 border border-amber-500/25 text-amber-700 dark:text-amber-300 text-xs font-extrabold text-center">
          👀 1. Adım: Parçaları incele ve kendin okumaya çalış!
        </div>

        <!-- 1. BÖLÜM: PARÇALARI GÖR VE DİNLE -->
        <div class="w-full flex items-center justify-center gap-2.5 py-2">
          <!-- 1. Parça -->
          <button onclick="speakPart(0)" class="group relative px-5 py-3.5 rounded-2xl bg-rose-500/10 border-2 border-rose-500/30 active:scale-95 transition slide-l flex flex-col items-center min-w-[95px]">

        </div>

    let activeWeekIdx = 0;
    let activeCardIdx = 0;
    let stars = 0;
    let completedSet = new Set();

    function speakTurkish(text, rate = 0.82) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const phoneticMap = {
        "n": "nı",
        "t": "tı",
        "l": "lı"
      };
      const cleanText = phoneticMap[text] || text;

      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.lang = 'tr-TR';
      utter.rate = rate;
      utter.pitch = 1.05;
      window.speechSynthesis.speak(utter);
    }

    function selectWeek(wIdx) {
      activeWeekIdx = wIdx;
      activeCardIdx = 0;

      document.querySelectorAll('.week-btn').forEach((btn, i) => {
        if (i === wIdx) {
          btn.className = "week-btn py-2 px-1 rounded-2xl border-2 text-center transition-all bg-blue-600 text-white border-blue-600 shadow-sm";
          btn.children[0].className = "text-[10px] font-bold opacity-85";
        } else {
          btn.className = "week-btn py-2 px-1 rounded-2xl border-2 text-center transition-all bg-[var(--card)] border-[var(--border)]";
          btn.children[0].className = "text-[10px] font-bold text-[var(--muted-foreground)]";
        }
      });

      renderCurrentCard();
      renderWeekGrid();
    }

    function renderCurrentCard() {
      const weekObj = first4WeeksPlan[activeWeekIdx];
      const item = weekObj.items[activeCardIdx];

      document.getElementById('week-desc').textContent = weekObj.desc;
      document.getElementById('card-progress').textContent = `${activeCardIdx + 1} / ${weekObj.items.length}`;

      const inst = document.getElementById('step-instruction');
      inst.className = "w-full py-1.5 px-3 rounded-xl bg-amber-500/10 border border-amber-500/25 text-amber-700 dark:text-amber-300 text-xs font-extrabold text-center";
      inst.textContent = "👀 1. Adım: Heceleri birleştirip yüksek sesle oku, sonra Ses tuşuyla teyit et!";

      document.getElementById('part-1-text').textContent = item.parts[0];
      document.getElementById('part-2-text').textContent = item.parts[1];

      const p3Wrap = document.getElementById('part-3-wrapper');
      if (item.parts.length >= 3) {
        p3Wrap.classList.remove('hidden');
        p3Wrap.classList.add('flex');
        document.getElementById('part-3-text').textContent = item.parts[2];
      } else {
        p3Wrap.classList.add('hidden');
        p3Wrap.classList.remove('flex');
      }

      const mergedEl = document.getElementById('merged-text');
      mergedEl.innerHTML = item.displayParts.map(dp => {
        const cls = dp.color === 'red' ? 'syl-red' : 'syl-blue';
        return `<span class="${cls}">${dp.text}</span>`;
      }).join('');

      const cardBox = document.getElementById('merged-card');
      cardBox.classList.remove('animate-pop', 'border-emerald-500', 'bg-emerald-500/5');
      cardBox.classList.add('border-blue-500/50');
      void cardBox.offsetWidth;
      cardBox.classList.add('animate-pop');

      document.getElementById('meaning-reveal').classList.add('hidden');
      const checkPanel = document.getElementById('self-check-panel');
      checkPanel.classList.add('hidden');
      checkPanel.classList.remove('grid');

      document.getElementById('verify-btn-label').textContent = "Sesle Teyit Et (Dinle)";
      renderWeekGrid();
    }

    function speakPart(partIdx) {
      const item = first4WeeksPlan[activeWeekIdx].items[activeCardIdx];
      if (item && item.parts[partIdx]) {
        speakTurkish(item.parts[partIdx], 0.8);
      }
    }

    function verifyReading() {
      const item = first4WeeksPlan[activeWeekIdx].items[activeCardIdx];
      if (!item) return;

      speakTurkish(item.tts, 0.8);

      const cardBox = document.getElementById('merged-card');
      cardBox.classList.remove('border-blue-500/50');
      cardBox.classList.add('border-emerald-500', 'bg-emerald-500/5');

      const reveal = document.getElementById('meaning-reveal');
      document.getElementById('meaning-emoji').textContent = item.emoji;
      document.getElementById('meaning-hint').textContent = item.hint;
      reveal.classList.remove('hidden');

      const inst = document.getElementById('step-instruction');
      inst.className = "w-full py-1.5 px-3 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-700 dark:text-emerald-300 text-xs font-extrabold text-center";
      inst.textContent = "🔊 Sesi dinledin! Doğru okuduysan 'Doğru Okudum' tuşuna bas!";

      document.getElementById('verify-btn-label').textContent = "Tekrar Dinle";

      const checkPanel = document.getElementById('self-check-panel');
      checkPanel.classList.remove('hidden');
      checkPanel.classList.add('grid');
    }

    function repeatCurrentCard() {
      const item = first4WeeksPlan[activeWeekIdx].items[activeCardIdx];
      speakTurkish(item.tts, 0.72);
    }

    function confirmCorrectAndNext() {
      const key = `${activeWeekIdx}-${activeCardIdx}`;
      if (!completedSet.has(key)) {
        completedSet.add(key);
        stars += 1;
        document.getElementById('star-score').textContent = stars;
      }
      nextCard();
    }

    function nextCard() {
      const items = first4WeeksPlan[activeWeekIdx].items;
      activeCardIdx = (activeCardIdx + 1) % items.length;
      renderCurrentCard();
    }

    function prevCard() {
      const items = first4WeeksPlan[activeWeekIdx].items;
      activeCardIdx = (activeCardIdx - 1 + items.length) % items.length;
      renderCurrentCard();
    }

    function jumpToCard(idx) {
      activeCardIdx = idx;
      renderCurrentCard();
    }

    function renderWeekGrid() {
      const items = first4WeeksPlan[activeWeekIdx].items;
      const grid = document.getElementById('week-items-grid');

      grid.innerHTML = items.map((it, idx) => {
        const isCurrent = idx === activeCardIdx;
        const isDone = completedSet.has(`${activeWeekIdx}-${idx}`);
        const coloredWord = it.displayParts.map(dp =>
          `<span class="${dp.color === 'red' ? 'syl-red' : 'syl-blue'}">${dp.text}</span>`
        ).join('');

        let borderCls = "border-[var(--border)] bg-[var(--background)]";
        if (isCurrent) borderCls = "border-blue-600 ring-2 ring-blue-500/25 bg-blue-500/5";
        else if (isDone) borderCls = "border-emerald-500/40 bg-emerald-500/5";

        return `
          <button onclick="jumpToCard(${idx})" class="relative py-2.5 px-2 rounded-2xl border-2 ${borderCls} font-black text-base flex items-center justify-center active:scale-95 transition">
            <span>${coloredWord}</span>
            ${isDone ? '<span class="absolute -top-1.5 -right-1.5 text-[11px] bg-emerald-500 text-white rounded-full w-4 h-4 flex items-center justify-center">✓</span>' : ''}
          </button>
        `;
      }).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
      selectWeek(0);
    });
  </script>
</body>
</html>
